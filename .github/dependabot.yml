version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ github.token }}
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_TOKEN }}
updates:
  - package-ecosystem: 'npm'
    rebase-strategy: auto
    registries:
      - npm-github
      - npm-npmjs
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '@types/node'
        update-types: ["version-update:semver-major"]
    groups:
      linter:
        applies-to: version-updates
        patterns:
          - "@tjsr/eslint-config"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
      vitest:
        applies-to: version-updates
        patterns:
        - "vitest"
        - "@vitest/*"
    assignees:
      - 'tjsr'
  - package-ecosystem: "github-actions"
    rebase-strategy: auto
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    assignees:
      - 'tjsr'
