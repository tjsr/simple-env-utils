name: Build simple-env-utils
run-name: Running simple-env-utils build.
on: [push, pull_request]
jobs:
  build-simple-env-utils:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Use configured Node.js version
      uses: actions/setup-node@v7
      with:
        node-version: ${{ vars.NODE_VERSION }}
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v7
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Use configured npm version
      run: npm install --global npm@${{ vars.NPM_VERSION }}

    - run: npm ci

    - name: Verify configured TypeScript version
      run: test "$(npx tsc --version)" = "Version ${{ vars.TYPESCRIPT_VERSION }}"

    - run: npm run test
    - run: npm run build

    - name: Package dry run on non-release branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm publish --dry-run
