name: Build simple-env-utils
run-name: Running simple-env-utils build.
on: [push, pull_request]
jobs:
  build-simple-env-utils:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    - name: Use configured Node.js version
      uses: actions/setup-node@v7
      with:
        node-version: ${{ vars.NODE_VERSION }}
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v6
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Use configured npm version
      run: npm install --global npm@latest

    - run: node --test scripts/npm-json.test.mjs

    - name: Check approved version is unused
      if: github.ref == 'refs/heads/fix/commonjs-package-declarations' || github.head_ref == 'fix/commonjs-package-declarations'
      run: node scripts/publish-approved-release.mjs --check

    - run: npm ci

    - name: Verify configured TypeScript version
      run: test "$(npx tsc --version)" = "Version ${{ vars.TYPESCRIPT_VERSION }}"

    - run: npm run test
    - run: npm run build
    - run: npm run build:dist
    - run: npm run test:package

    - name: Package dry run on non-release branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm publish --dry-run

  publish-approved-fix:
    name: Publish approved simple-env-utils 0.1.11
    needs: build-simple-env-utils
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release simple-env-utils 0.1.11')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: simple-env-utils-approved-release-0.1.11
      cancel-in-progress: false
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
      - run: npm install --global npm@latest
      - run: npm ci
      - run: node scripts/publish-approved-release.mjs
